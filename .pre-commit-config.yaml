# Scoped to this item's tree plus code this and later items own; excludes
# pre-existing agent-tooling/docs content (.claude/, .codex/, graphify-out/)
# that predates this config and isn't ours to reformat (AGENTS.md: don't
# change docs/design/* or another item's files).
exclude: '^(\.claude/|\.codex/|graphify-out/|docs/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
