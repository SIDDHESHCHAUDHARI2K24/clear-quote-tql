[project]
name = "clear-quote"
version = "0.1.0"
description = "Clear Quote — Total Quality Lending prototype mortgage quoting system"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.14.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.102",
    "cryptography>=44.0.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pillow>=11.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "redis>=8.1.0",
    "reportlab>=4.2.5",
    "sqlalchemy[asyncio]>=2.1.0",
    "temporalio>=1.33.0",
    "uvicorn[standard]>=0.53.0",
    "weasyprint>=70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "seed"]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.1",
  # CQ-009: in-process fake for app.integrations.common.failure_toggle's
  # redis.asyncio client in tests -- CI has no Valkey/Redis service, and the
  # real local Valkey is shared with parallel agents (see plan.md Decision 1).
  "fakeredis>=2.26.0",
  # CQ-010: seed/tests/test_documents_watermarked.py reads back the burned-in
  # "SAMPLE" watermark text from the generated PDF.
  "pypdf>=5.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)`/`Query(...)`/etc. in argument defaults is
# the framework's own idiom, not the mutable-default-argument bug B008
# guards against — every feature router uses it (CQ-004 onward).
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
disallow_untyped_defs = true
# `make lint` passes explicit paths (backend/app backend/conftest.py
# backend/tests backend/scripts) rather than using `packages`/`files` here,
# so this config applies uniformly to production code, fixtures, tests and
# scripts alike.

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# CQ-010: no third-party type stubs published for these.
module = ["reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# CQ-024: backend/scripts/freeze_sent_version.py reads seed/personas/*.yaml
# directly (no third-party type stubs published for pyyaml).
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend"]
# `.` (repo root) so `seed/tests/*` (CQ-010) can `import seed...` /
# `import app...` when run explicitly (`uv run pytest seed/tests/...`) --
# `testpaths` only gates a bare `pytest` invocation, not an explicit path.
pythonpath = ["backend", "."]
asyncio_mode = "auto"
# A session-scoped `test_engine` fixture (backend/conftest.py) must run in
# the same event loop as the tests that use it, or asyncpg raises "Future
# attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
