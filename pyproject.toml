[project]
name = "clear-quote"
version = "0.1.0"
description = "Clear Quote — Total Quality Lending prototype mortgage quoting system"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["backend"]
