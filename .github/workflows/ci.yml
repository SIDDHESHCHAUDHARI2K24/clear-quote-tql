name: CI

# Every push (any branch) and every pull request gets the same lint /
# type-check / test signal a human would run locally, on the backend and
# both frontends (CQ-006, docs/backlog/CQ-006-ci/spec.md). Not scoped to
# `main` — a branch must be provably green before merge.
on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: neither job writes anything back to the repo or the PR.
permissions:
  contents: read

# Cancel a stale run when new commits land on the same branch/PR ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cq
          POSTGRES_PASSWORD: cq
          POSTGRES_DB: cq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      # CQ-007's FIELD_ENCRYPTION_KEY startup check is skipped under
      # APP_ENV=test (backend/conftest.py sets this for pytest already;
      # set here too so app import at collection time never fails).
      SECRET_KEY: ci-dummy-secret
      DATABASE_URL: postgresql+asyncpg://cq:cq@localhost:5432/cq_dev
      TEST_DATABASE_URL: postgresql+asyncpg://cq:cq@localhost:5432/cq_test
      # CQ-014: real Valkey now backs OTP/session/rate-limit tests
      # (backend/conftest.py's `valkey` fixture FLUSHDBs this db before and
      # after every test) — db 1, distinct from the db 0 other tools use.
      VALKEY_URL: redis://localhost:6379/1
      # Dummy values below: CQ-004's /health checks are monkeypatched in
      # tests, so these never need to resolve in CI (see CQ-006 spec Notes).
      S3_ENDPOINT: http://localhost:9010
      S3_BUCKET: clear-quote
      S3_ACCESS_KEY: cq-dummy
      S3_SECRET_KEY: cq-dummy
      S3_REGION: us-east-1
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@clearquote.local
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: clear-quote-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      - run: uv run ruff check backend

      - run: uv run ruff format --check backend

      # Same paths as `make lint`'s mypy line, kept in sync deliberately —
      # never diverge from the Makefile target.
      - run: uv run mypy backend/app backend/conftest.py backend/tests backend/scripts

      - run: uv run pytest backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run lint

      - run: pnpm -r run typecheck

      - run: pnpm exec prettier --check .

      - run: pnpm -r run test
